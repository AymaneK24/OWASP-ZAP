env:
  contexts:
    - name: backend
      urls:
        - https://jesa.aymanekenbouch.online

  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:

  # =========================
  # 1. IMPORT OPENAPI SPEC
  # =========================
  - type: openapi
    parameters:
      apiUrl: https://jesa.aymanekenbouch.online/swagger.json
      context: backend
      targetUrl: https://jesa.aymanekenbouch.online

  # =========================
  # 2. PASSIVE SCAN WAIT
  # =========================
  - type: passiveScan-wait
    parameters:
      maxDuration: 20

  # =========================
  # 3. ACTIVE SCAN
  # =========================
  - type: activeScan
    parameters:
      context: backend
      policy: Default Policy
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 45
      delayInMs: 0
      threadPerHost: 10

  # =========================
  # 4. REPORT (HTML)
  # =========================
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/
      reportFile: zap-report.html
      reportTitle: "DAST Report - jesa.aymanekenbouch.online"
      reportDescription: "Authenticated ZAP scan via OpenAPI spec"

  # =========================
  # 5. REPORT (JSON)
  # =========================
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/
      reportFile: zap-report.json