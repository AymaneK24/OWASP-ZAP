<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SARIF Security Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      background: #111827;
      padding: 25px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 35px;
    }

    .nav-item {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.3s;
      color: #cbd5e1;
    }

    .nav-item:hover,
    .nav-item.active {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white;
    }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 2rem;
    }

    .upload-btn {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    .card {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-title {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 700;
    }

    .critical { color: #ef4444; }
    .high { color: #f97316; }
    .medium { color: #eab308; }
    .low { color: #22c55e; }

    .report-section {
      margin-top: 30px;
    }

    .section-title {
      font-size: 1.4rem;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .issues-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 18px;
      background: #111827;
    }

    .issues-table thead {
      background: #1e293b;
    }

    .issues-table th,
    .issues-table td {
      padding: 18px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .issues-table th {
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .issues-table tr:hover {
      background: rgba(255,255,255,0.03);
    }

    .badge {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge-critical {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .badge-high {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
    }

    .badge-medium {
      background: rgba(234, 179, 8, 0.15);
      color: #eab308;
    }

    .badge-low {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .resolved {
      background: #22c55e;
    }

    .open {
      background: #ef4444;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.08);
      color: #cbd5e1;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #2563eb;
      color: white;
    }

    .json-upload {
      display: none;
    }

    @media(max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        gap: 12px;
      }

      .logo {
        display: none;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">SecureScan</div>

    <div class="nav-item active">Dashboard</div>
    <div class="nav-item">Security Issues</div>
    <div class="nav-item">OWASP ZAP</div>
    <div class="nav-item">SARIF Reports</div>
    <div class="nav-item">Compliance</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Security Assessment Report</h1>

      <div>
        <input type="file" id="sarifUpload" class="json-upload" accept=".json,.sarif" />
        <button class="upload-btn" onclick="document.getElementById('sarifUpload').click()">
          Upload SARIF
        </button>
      </div>
    </div>

    <div class="summary-grid">
      <div class="card">
        <div class="card-title">Critical Issues</div>
        <div class="card-value critical" id="criticalCount">0</div>
      </div>

      <div class="card">
        <div class="card-title">High Severity</div>
        <div class="card-value high" id="highCount">0</div>
      </div>

      <div class="card">
        <div class="card-title">Medium Severity</div>
        <div class="card-value medium" id="mediumCount">0</div>
      </div>

      <div class="card">
        <div class="card-title">Low Severity</div>
        <div class="card-value low" id="lowCount">0</div>
      </div>
    </div>

    <div class="report-section">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="critical">Critical</button>
        <button class="filter-btn" data-filter="high">High</button>
        <button class="filter-btn" data-filter="medium">Medium</button>
        <button class="filter-btn" data-filter="low">Low</button>
      </div>

      <h2 class="section-title">Detected Vulnerabilities</h2>

      <table class="issues-table">
        <thead>
          <tr>
            <th>Rule</th>
            <th>Description</th>
            <th>Severity</th>
            <th>File</th>
            <th>Line</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="issuesTableBody"></tbody>
      </table>
    </div>
  </main>

  <script>
    const sampleIssues = [
      {
        rule: 'SQL Injection',
        description: 'Unsanitized user input detected in SQL query.',
        severity: 'critical',
        file: 'src/api/userController.js',
        line: 48,
        status: 'Open'
      },
      {
        rule: 'Cross-Site Scripting',
        description: 'Reflected XSS vulnerability detected.',
        severity: 'high',
        file: 'src/components/Search.jsx',
        line: 91,
        status: 'Open'
      },
      {
        rule: 'Weak Cryptography',
        description: 'MD5 hashing algorithm used.',
        severity: 'medium',
        file: 'src/security/hash.js',
        line: 12,
        status: 'Open'
      },
      {
        rule: 'Information Disclosure',
        description: 'Stack trace exposed to end users.',
        severity: 'low',
        file: 'src/server/errorHandler.js',
        line: 34,
        status: 'Resolved'
      }
    ];

    let currentIssues = [...sampleIssues];

    const tableBody = document.getElementById('issuesTableBody');

    function renderIssues(issues) {
      tableBody.innerHTML = '';

      issues.forEach(issue => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${issue.rule}</td>
          <td>${issue.description}</td>
          <td>
            <span class="badge badge-${issue.severity}">
              ${issue.severity.toUpperCase()}
            </span>
          </td>
          <td>${issue.file}</td>
          <td>${issue.line}</td>
          <td>
            <div class="status">
              <span class="dot ${issue.status === 'Resolved' ? 'resolved' : 'open'}"></span>
              ${issue.status}
            </div>
          </td>
        `;

        tableBody.appendChild(row);
      });

      updateSummary(issues);
    }

    function updateSummary(issues) {
      const counts = {
        critical: 0,
        high: 0,
        medium: 0,
        low: 0
      };

      issues.forEach(issue => {
        counts[issue.severity]++;
      });

      document.getElementById('criticalCount').textContent = counts.critical;
      document.getElementById('highCount').textContent = counts.high;
      document.getElementById('mediumCount').textContent = counts.medium;
      document.getElementById('lowCount').textContent = counts.low;
    }

    function filterIssues(level) {
      if (level === 'all') {
        renderIssues(currentIssues);
        return;
      }

      const filtered = currentIssues.filter(issue => issue.severity === level);
      renderIssues(filtered);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        filterIssues(btn.dataset.filter);
      });
    });

    document.getElementById('sarifUpload').addEventListener('change', function(event) {
      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        try {
          const sarif = JSON.parse(e.target.result);
          const parsedIssues = [];

          sarif.runs?.forEach(run => {
            run.results?.forEach(result => {
              const level = mapSeverity(result.level || 'warning');

              parsedIssues.push({
                rule: result.ruleId || 'Unknown Rule',
                description: result.message?.text || 'No description available',
                severity: level,
                file: result.locations?.[0]?.physicalLocation?.artifactLocation?.uri || 'Unknown File',
                line: result.locations?.[0]?.physicalLocation?.region?.startLine || '-',
                status: 'Open'
              });
            });
          });

          currentIssues = parsedIssues;
          renderIssues(currentIssues);

          alert('SARIF report loaded successfully!');
        }
        catch(error) {
          console.error(error);
          alert('Invalid SARIF JSON file.');
        }
      };

      reader.readAsText(file);
    });

    function mapSeverity(level) {
      switch(level.toLowerCase()) {
        case 'error':
          return 'critical';

        case 'warning':
          return 'high';

        case 'note':
          return 'medium';

        default:
          return 'low';
      }
    }

    renderIssues(currentIssues);
  </script>

</body>
</html>
